renderer:
  # Shared secret used by oStella. Leave empty only on a trusted private network.
  apiKey: ""
  danserPath: "danser/danser-cli"
  # Command prefix to run Danser with. For example, "xvfb-run -a" is required on headless Linux servers.
  commandPrefix: "xvfb-run -a"
  # Command prefix to run Danser with on Windows.
  commandPrefixWin: ""
  # Temporary uploaded inputs are stored below this directory and deleted after rendering.
  workPath: "data"
  # Persistent beatmapset (.osz) and replay (.osr) cache shared by render jobs.
  cachePath: "data/cache"
  # Maximum number of waiting jobs; running jobs are not counted.
  renderQueueSize: 5
  renderThreads: 1
  resultTtlMinutes: 15
  renderTimeoutMinutes: 10
  # Config file to use for rendering. Will be merged with the config sent by oStella.
  danserConfigPath: ""

webserver:
  port: 8722
  # Must be large enough for one beatmapset plus all replay files.
  maxRequestSizeMb: 512
